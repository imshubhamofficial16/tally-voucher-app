version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tally_postgres
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
      POSTGRES_DB: tally_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tally_api
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./raw_files:/app/raw_files
      - ./.env:/app/.env
      - ../fixtures:/fixtures:ro
    environment:
      - DATABASE_URL=postgresql://tally:tally@db:5432/tally_db
      - RAW_FILES_DIR=/app/raw_files
      - MAX_UPLOAD_SIZE_MB=100
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
